
name: Deploy Node.js Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            echo "========== DEPLOYMENT STARTED =========="

            echo "STEP 1: Checking VPS connection"
            whoami
            pwd

            echo "STEP 2: Going to project directory"
            cd /home/baiju/deploy-via-cicd
            echo "SUCCESS: Project directory found"

            echo "STEP 3: Checking Git status"
            git status

            echo "STEP 4: Pulling latest code"
            git pull origin main
            echo "SUCCESS: Git pull completed"

            echo "STEP 5: Installing dependencies"
            npm install
            echo "SUCCESS: Dependencies installed"

            echo "STEP 6: Restarting PM2"
            pm2 restart cicd-deploy || pm2 start index.js --name cicd-deploy
            echo "SUCCESS: PM2 application restarted"

            echo "STEP 7: Saving PM2"
            pm2 save
            echo "SUCCESS: PM2 saved"

            echo "========== DEPLOYMENT COMPLETED =========="
